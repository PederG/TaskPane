name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore TaskPane.sln
      - name: Build libraries and tests
        run: >
          dotnet build TaskPane.sln
          -c Release
          --no-restore
          -p:EnableWindowsTargeting=true
          -p:BuildProjectReferences=true
      - name: Test
        run: >
          dotnet test TaskPane.sln
          -c Release
          --no-build
          --filter "FullyQualifiedName!~TaskPane.App"
          --logger "trx;LogFileName=test-results.trx"

  build-wpf-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore TaskPane.sln
      - name: Build full solution including WPF
        run: dotnet build TaskPane.sln -c Release --no-restore
      - name: Test
        run: dotnet test TaskPane.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"
